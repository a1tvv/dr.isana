<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Доставка по городу за 2 часа">
  <defs>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6fb"/>
      <stop offset="1" stop-color="#cfe9f3"/>
    </linearGradient>
  </defs>
  <circle cx="300" cy="240" r="185" fill="#57c8de" opacity="0.10"/>
  <circle cx="448" cy="118" r="58" fill="#57c8de" opacity="0.12"/>

  <!-- speed lines -->
  <g stroke="#57c8de" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <line x1="60" y1="250" x2="150" y2="250"/>
    <line x1="40" y1="288" x2="120" y2="288"/>
    <line x1="70" y1="326" x2="150" y2="326"/>
  </g>

  <!-- parcel box (2.5D) -->
  <path d="M168 252 L208 212 L432 212 L392 252 Z" fill="url(#boxTop)"/>
  <path d="M392 252 L432 212 L432 366 L392 406 Z" fill="#a6d8e6"/>
  <path d="M168 252 L392 252 L392 406 L168 406 Z" fill="#cbe9f3"/>
  <rect x="270" y="252" width="22" height="154" fill="#0d263a" opacity="0.10"/>
  <path d="M250 232 L290 232 L290 252 L270 252 Z" fill="#0d263a" opacity="0.08"/>

  <!-- shipping label -->
  <rect x="200" y="288" width="128" height="74" rx="9" fill="#ffffff"/>
  <g transform="translate(222 325)" fill="none" stroke="#2ea7c2" stroke-width="4" stroke-linejoin="round">
    <path d="M-9 -6 L0 -12 L9 -6 L9 6 L-9 6 Z"/>
  </g>
  <g fill="#0d263a" opacity="0.85">
    <rect x="246" y="306" width="66" height="5" rx="2.5"/>
    <rect x="246" y="318" width="52" height="5" rx="2.5"/>
  </g>
  <g fill="#0d263a">
    <rect x="246" y="338" width="3" height="14"/>
    <rect x="252" y="338" width="5" height="14"/>
    <rect x="260" y="338" width="3" height="14"/>
    <rect x="266" y="338" width="6" height="14"/>
    <rect x="275" y="338" width="3" height="14"/>
    <rect x="281" y="338" width="5" height="14"/>
    <rect x="290" y="338" width="3" height="14"/>
    <rect x="296" y="338" width="6" height="14"/>
  </g>

  <!-- map pin -->
  <g transform="translate(452 150)">
    <path d="M0 -34 C19 -34 30 -20 30 -4 C30 16 6 34 0 44 C-6 34 -30 16 -30 -4 C-30 -20 -11 -34 0 -34 Z" fill="#0d263a"/>
    <circle cx="0" cy="-4" r="11" fill="#57c8de"/>
  </g>

  <!-- 2 hours badge -->
  <g transform="translate(132 350)">
    <circle r="54" fill="#0d263a"/>
    <circle r="54" fill="none" stroke="#57c8de" stroke-width="3" opacity="0.6"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff">2</text>
    <text x="0" y="24" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#57c8de">ЧАСА</text>
  </g>
</svg>
