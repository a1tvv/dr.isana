="#f5f5f7">USE_SPACES</text><text x="330" y="318" font-size="21" font-weight="500" fill="#86868b">True — фото хранятся в DigitalOcean Spaces</text><line x1="48" y1="277" x2="1152" y2="277" stroke="#ffffff" stroke-opacity="0.08"/><text x="48" y="384" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600" fill="#f5f5f7">DO_SPACES_*</text><text x="330" y="384" font-size="21" font-weight="500" fill="#86868b">ключ, секрет, бакет и адрес Spaces</text><line x1="48" y1="343" x2="1152" y2="343" stroke="#ffffff" stroke-opacity="0.08"/>
