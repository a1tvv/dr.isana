<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Переменные окружения: SECRET_KEY — без неё сайт не запустится; DEBUG — True — только на своём компьютере; ALLOWED_HOSTS — домены через запятую; DATABASE_URL — PostgreSQL, без неё — локальная SQLite; USE_SPACES — True — фото хранятся в DigitalOcean Spaces; DO_SPACES_* — ключ, секрет, бакет и адрес Spaces">
