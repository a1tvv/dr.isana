<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252" role="img" aria-label="Деплой: Пуш в main — Vercel сам выкатит новую версию; Правили CSS, JS или картинки — collectstatic и закоммитить staticfiles/; Новая миграция — migrate с DATABASE_URL продовой базы">
<defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#000000"/></linearGradient><linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#0a84ff"/></linearGradient></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="1199" height="251" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><circle cx="66" cy="59" r="18" fill="url(#num)"/><text x="66" y="66" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="104" y="66" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Пуш в </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">main</tspan><tspan> — Vercel сам выкатит новую версию</tspan></text><circle cx="66" cy="123" r="18" fill="url(#num)"/><text x="66" y="130" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="104" y="130" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Правили CSS, JS или картинки — </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">collectstatic</tspan><tspan> и закоммитить </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">staticfiles/</tspan></text><line x1="104" y1="91" x2="1152" y2="91" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="66" cy="187" r="18" fill="url(#num)"/><text x="66" y="194" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="104" y="194" font-size="21" font-weight="500" fill="#d1d1d6"><tspan>Новая миграция — </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">migrate</tspan><tspan> с </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#64d2ff">DATABASE_URL</tspan><tspan> продовой базы</tspan></text><line x1="104" y1="155" x2="1152" y2="155" stroke="#ffffff" stroke-opacity="0.08"/>
</g>
</svg>
